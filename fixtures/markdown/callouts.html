<div
  data-callout-metadata=""
  data-callout-fold=""
  data-callout="note"
  data-callout-type="note"
  data-callout-icon="pencil"
  class="callout"
>
  <div class="callout-title">
    <div class="callout-icon"></div>
    <div class="callout-title-inner">Note</div>
  </div>
  <div class="callout-content">
    <p>Default title.</p>
  </div>
</div>
<div
  data-callout-metadata=""
  data-callout-fold=""
  data-callout="tip"
  data-callout-type="tip"
  data-callout-icon="flame"
  class="callout"
>
  <div class="callout-title">
    <div class="callout-icon"></div>
    <div class="callout-title-inner">Custom <em>title</em></div>
  </div>
  <div class="callout-content">
    <p>Body with <strong>bold</strong>.</p>
    <p>Second paragraph.</p>
  </div>
</div>
<div
  data-callout-metadata="wide"
  data-callout-fold="-"
  data-callout="warning"
  data-callout-type="warning"
  data-callout-icon="triangle-alert"
  class="callout is-collapsible is-collapsed"
>
  <div class="callout-title">
    <div class="callout-icon"></div>
    <div class="callout-title-inner">Collapsed</div>
    <div class="callout-fold"></div>
  </div>
  <div class="callout-content" style="display: none">
    <p>Hidden until expanded.</p>
  </div>
</div>
<div
  data-callout-metadata=""
  data-callout-fold="+"
  data-callout="faq"
  data-callout-type="question"
  data-callout-icon="circle-help"
  class="callout is-collapsible"
>
  <div class="callout-title">
    <div class="callout-icon"></div>
    <div class="callout-title-inner">Nested</div>
    <div class="callout-fold"></div>
  </div>
  <div class="callout-content">
    <div
      data-callout-metadata=""
      data-callout-fold=""
      data-callout="quote"
      data-callout-type="quote"
      data-callout-icon="quote"
      class="callout"
    >
      <div class="callout-title">
        <div class="callout-icon"></div>
        <div class="callout-title-inner">Quote</div>
      </div>
      <div class="callout-content">
        <p>Inner callout.</p>
      </div>
    </div>
  </div>
</div>
<blockquote>
  <p>Plain quote, not a callout.</p>
</blockquote>
